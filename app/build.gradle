plugins {
    alias(libs.plugins.android.application)
}

android {
    // Redirigir la carpeta build a /tmp
    project.layout.buildDirectory.set(file("/tmp/teclado-bios/app-build"))

    namespace 'com.diamon.tecladobios'
    compileSdk 34

    defaultConfig {
        applicationId "com.diamon.tecladobios"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.usb.serial.for.android
}
