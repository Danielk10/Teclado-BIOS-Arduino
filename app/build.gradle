plugins {
    alias(libs.plugins.android.application)
}

android {
    // Redirigir la carpeta build a /tmp
    project.layout.buildDirectory.set(file("/tmp/teclado-bios/app-build"))

    namespace 'com.diamon.tecladobios'
    compileSdk 37

    defaultConfig {
        applicationId "com.diamon.tecladobios"
        minSdk 23
        targetSdk 37
        versionCode 2
        versionName "1.0.1"

        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildToolsVersion '37.0.0'
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.vectordrawable
    implementation libs.usb.serial.for.android
}
