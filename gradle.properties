# Enforce UTF-8 & locale
android.useAndroidX=true
android.nonTransitiveRClass=true

systemProp.user.language=en
systemProp.user.country=US
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.java.net.preferIPv4Stack=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Redirigir la caché de Gradle de usuario a /tmp para no llenar el disco persistente
systemProp.gradle.user.home=/tmp/.gradle
gradle.user.home=/tmp/.gradle
