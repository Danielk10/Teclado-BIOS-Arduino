pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'Teclado-BIOS-Arduino'
include ':app'

// Redirigir el build directory de todos los proyectos a /tmp antes de la configuración
gradle.beforeProject { p ->
    if (p.name == 'app') {
        p.layout.buildDirectory.set(file("/tmp/teclado-bios/app-build"))
    } else {
        p.layout.buildDirectory.set(file("/tmp/teclado-bios/root-build"))
    }
}
